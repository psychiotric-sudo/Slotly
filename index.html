<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Slotly — College Timetable Planner</title>
    <meta
      name="description"
      content="Slotly is a free college timetable planner. Build your weekly schedule visually, spot overlaps, and export it to JPG, PDF, or sync it with Google Calendar."
    />
    <meta name="keywords" content="timetable, schedule, college, university, class planner, weekly schedule, Google Calendar, jpg, pdf" />
    <meta name="author" content="Slotly" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#1E3A8A" />
    <link rel="canonical" href="https://slotly-timetable.vercel.app/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Slotly" />
    <meta property="og:title" content="Slotly — College Timetable Planner" />
    <meta
      property="og:description"
      content="Plan your weekly college timetable visually, spot scheduling overlaps, and export to JPG, PDF, or Google Calendar."
    />
    <meta property="og:url" content="https://slotly-timetable.vercel.app/" />
    <meta property="og:image" content="https://slotly-timetable.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Slotly — College Timetable Planner" />
    <meta
      name="twitter:description"
      content="Plan your weekly college timetable visually, spot scheduling overlaps, and export to JPG, PDF, or Google Calendar."
    />
    <meta name="twitter:image" content="https://slotly-timetable.vercel.app/og-image.png" />

    <!--
      Google Search Console: once you own the domain, paste the verification
      meta tag provided by Google between the head tags below, then remove this
      comment. Example (do not use this placeholder):
      <meta name="google-site-verification" content="YOUR_VERIFICATION_CODE" />
    -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var raw = localStorage.getItem("schedule_v1");
          var theme = "dark";
          if (raw) {
            var parsed = JSON.parse(raw);
            if (parsed && parsed.settings && parsed.settings.theme) {
              theme = parsed.settings.theme;
            }
          }
          document.documentElement.dataset.theme = theme;
        } catch (e) {
          document.documentElement.dataset.theme = "dark";
        }
      })();
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Slotly",
        "url": "https://slotly-timetable.vercel.app/",
        "applicationCategory": "EducationalApplication",
        "operatingSystem": "Any",
        "description": "Free college timetable planner. Build a weekly visual schedule, spot overlaps, and export to JPG, PDF, or Google Calendar.",
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "USD"
        }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
